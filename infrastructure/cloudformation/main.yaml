AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Root stack (eu-west-2). Deploys the whole application for one
  environment as nested stacks. Package with `aws cloudformation package` (scripts/deploy.sh
  does this), which uploads the nested templates and rewrites their TemplateURLs.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Environment }
        Parameters: [Environment, ProjectName, BusinessDisplayName, BakerName]
      - Label: { default: People }
        Parameters: [AdminEmail, SecondAdminEmail, InternalNotificationEmails, OpsAlertEmail]
      - Label: { default: Domain (leave empty to use the *.cloudfront.net address) }
        Parameters: [DomainName, HostedZoneId, CertificateArn, WebAclArn]
      - Label: { default: Email }
        Parameters: [CustomerEmailEnabled, SesFromAddress]
      - Label: { default: Deployment (set by scripts/deploy.sh) }
        Parameters: [ArtifactsBucketName, CodeVersion, OriginVerifySecret]
      - Label: { default: Tuning }
        Parameters: [CognitoDomainPrefix, LogRetentionDays, CreateOrderReservedConcurrency]

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: kvc
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  BusinessDisplayName:
    Type: String
    MinLength: 1
    Description: >-
      The shop's name, shown to customers. Without spaces it is also the SNS topic prefix
      and the Project tag, so changing it in a live environment replaces the SNS topics.
  BakerName:
    Type: String
    MinLength: 1
    Description: First name the shop and emails use for the baker, e.g. "Sam".
  AdminEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.
  SecondAdminEmail:
    Type: String
    Default: ""
    Description: Optional second admin of the admin portal. Leave empty for none.
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be empty or an email address.
  InternalNotificationEmails:
    Type: CommaDelimitedList
    Description: Comma-separated (no spaces), up to 5 addresses for new-order notifications.
  OpsAlertEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.
  DomainName:
    Type: String
    Default: ""
  HostedZoneId:
    Type: String
    Default: ""
  CertificateArn:
    Type: String
    Default: ""
  WebAclArn:
    Type: String
    Default: ""
  CustomerEmailEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Send SES customer emails. Has no effect until a custom domain exists (decision D3).
  SesFromAddress:
    Type: String
    Default: ""
    Description: e.g. orders@<domain>. Only used when a custom domain exists.
  ArtifactsBucketName:
    Type: String
    Description: Output of the bootstrap stack.
  CodeVersion:
    Type: String
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: Lambda code folder under lambda/ in the artifacts bucket (deploy.sh uses the git commit).
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Generated by deploy.sh on first deploy and kept on updates. Never committed.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the admin sign-in page.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  CreateOrderReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    Description: Max concurrent order submissions (0 = no reservation). See docs/deployment.md before raising or lowering.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Rules:
  RegionIsLondon:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", eu-west-2]
        AssertDescription: This stack is designed for eu-west-2 (London).
  DomainNeedsZoneAndCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref HostedZoneId, ""]]
          - !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: HostedZoneId and CertificateArn are required when DomainName is set.

Resources:
  # Stage 1 (in parallel): no dependencies.
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/data.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/auth.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BusinessDisplayName: !Ref BusinessDisplayName
        AdminEmail: !Ref AdminEmail
        SecondAdminEmail: !Ref SecondAdminEmail
        CognitoDomainPrefix: !Ref CognitoDomainPrefix

  MessagingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/messaging.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BusinessDisplayName: !Ref BusinessDisplayName
        InternalNotificationEmails: !Join [",", !Ref InternalNotificationEmails]
        OpsAlertEmail: !Ref OpsAlertEmail
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId

  ApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/api-gateway.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BusinessDisplayName: !Ref BusinessDisplayName

  # Stage 2: needs the API's hostname and the Cognito domain.
  FrontendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/frontend.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BusinessDisplayName: !Ref BusinessDisplayName
        HttpApiDomain: !GetAtt ApiGatewayStack.Outputs.HttpApiDomain
        CognitoDomain: !GetAtt AuthStack.Outputs.CognitoDomain
        OriginVerifySecret: !Ref OriginVerifySecret
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId
        CertificateArn: !Ref CertificateArn
        WebAclArn: !Ref WebAclArn

  # Stage 3: needs the site URL (for the Cognito callback) and everything above.
  BackendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/backend.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        BusinessDisplayName: !Ref BusinessDisplayName
        BakerName: !Ref BakerName
        ArtifactsBucketName: !Ref ArtifactsBucketName
        CodeVersion: !Ref CodeVersion
        TableName: !GetAtt DataStack.Outputs.TableName
        TableArn: !GetAtt DataStack.Outputs.TableArn
        TableStreamArn: !GetAtt DataStack.Outputs.TableStreamArn
        OrderTopicArn: !GetAtt MessagingStack.Outputs.OrderTopicArn
        NotifierDlqArn: !GetAtt MessagingStack.Outputs.NotifierDlqArn
        UserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
        IssuerUrl: !GetAtt AuthStack.Outputs.IssuerUrl
        HttpApiId: !GetAtt ApiGatewayStack.Outputs.HttpApiId
        SiteUrl: !GetAtt FrontendStack.Outputs.SiteUrl
        OriginVerifySecret: !Ref OriginVerifySecret
        LogRetentionDays: !Ref LogRetentionDays
        CustomerEmailEnabled: !If [HasCustomDomain, !Ref CustomerEmailEnabled, "false"]
        SesFromAddress: !Ref SesFromAddress
        SesIdentityArn: !GetAtt MessagingStack.Outputs.SesIdentityArn
        SesConfigurationSetName: !GetAtt MessagingStack.Outputs.SesConfigurationSetName
        CreateOrderReservedConcurrency: !Ref CreateOrderReservedConcurrency

  # Stage 4: alarms on everything.
  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/monitoring.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        OpsTopicArn: !GetAtt MessagingStack.Outputs.OpsTopicArn
        NotifierDlqName: !GetAtt MessagingStack.Outputs.NotifierDlqName
        OrderTopicName: !Select [5, !Split [":", !GetAtt MessagingStack.Outputs.OrderTopicArn]]
        HttpApiId: !GetAtt ApiGatewayStack.Outputs.HttpApiId
        CatalogueFunctionName: !GetAtt BackendStack.Outputs.CatalogueFunctionName
        CreateOrderFunctionName: !GetAtt BackendStack.Outputs.CreateOrderFunctionName
        AdminApiFunctionName: !GetAtt BackendStack.Outputs.AdminApiFunctionName
        AdminExportFunctionName: !GetAtt BackendStack.Outputs.AdminExportFunctionName
        NotifierFunctionName: !GetAtt BackendStack.Outputs.NotifierFunctionName

Outputs:
  # Read by scripts/deploy.sh to write the frontend's runtime config.json.
  SiteUrl:
    Value: !GetAtt FrontendStack.Outputs.SiteUrl
  SiteBucketName:
    Value: !GetAtt FrontendStack.Outputs.SiteBucketName
  DistributionId:
    Value: !GetAtt FrontendStack.Outputs.DistributionId
  UserPoolId:
    Value: !GetAtt AuthStack.Outputs.UserPoolId
  AdminAppClientId:
    Value: !GetAtt BackendStack.Outputs.AdminAppClientId
  CognitoDomain:
    Value: !GetAtt AuthStack.Outputs.CognitoDomain
  TableName:
    Value: !GetAtt DataStack.Outputs.TableName
  OrderTopicArn:
    Value: !GetAtt MessagingStack.Outputs.OrderTopicArn
  NotifierDlqName:
    Value: !GetAtt MessagingStack.Outputs.NotifierDlqName
