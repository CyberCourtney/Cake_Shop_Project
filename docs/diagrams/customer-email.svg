<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 988" width="1600" height="988" role="img" aria-labelledby="t d">
  <title id="t">Customer email flow</title>
  <desc id="d">Sequence: a new order on the DynamoDB stream triggers the notifier, which sends the customer an email through SES. Failures are retried, then sent to a dead-letter queue that raises a CloudWatch alarm.</desc>
