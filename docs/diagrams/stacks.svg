  <path d="M376 532 C430 532 430 480 468 480" fill="none" stroke="#2EC5FF" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-sky)"/>
  <rect x="381" y="551" width="127" height="22" rx="11" fill="#14153A"/><text x="392" y="566" class="lbl" fill="#2EC5FF">certificate ARN</text>
  <path d="M780 252 C830 252 830 540 868 540" fill="none" stroke="#B8F23A" stroke-width="2" marker-end="url(#a-lime)"/>
  <path d="M780 380 C825 380 825 310 868 310" fill="none" stroke="#9D8FFF" stroke-width="2" marker-end="url(#a-violet)"/>
  <path d="M780 400 C830 400 830 552 868 552" fill="none" stroke="#9D8FFF" stroke-width="2" marker-end="url(#a-violet)"/>
  <path d="M780 532 H868" fill="none" stroke="#FF6B6B" stroke-width="2" marker-end="url(#a-coral)"/>
  <path d="M780 560 C1000 700 1150 700 1260 606" fill="none" stroke="#FF6B6B" stroke-width="2" marker-end="url(#a-coral)"/>
  <path d="M780 660 C835 660 830 340 868 340" fill="none" stroke="#2EC5FF" stroke-width="2" marker-end="url(#a-sky)"/>
  <path d="M780 672 C840 672 840 590 868 586" fill="none" stroke="#2EC5FF" stroke-width="2" marker-end="url(#a-sky)"/>
  <path d="M1005 364 V518" fill="none" stroke="#2EC5FF" stroke-width="2" marker-end="url(#a-sky)"/>
  <text x="1015" y="446" class="lbl" fill="#2EC5FF">site URL</text>
  <path d="M1140 562 H1228" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#a-mango)"/>
  <text x="1230" y="220" class="lbl" fill="#A9ABD0">Why a bare API stack?</text><text x="1230" y="242" class="ns">frontend needs the API URL and</text><text x="1230" y="258" class="ns">backend needs the site URL.</text><text x="1230" y="274" class="ns">Creating the API on its own</text><text x="1230" y="290" class="ns">first breaks that loop.</text>
  <g transform="translate(56 820)"><circle cx="8" cy="0" r="6" fill="#B8F23A"/><text x="22" y="4.5" class="ns">data</text><circle cx="84.4" cy="0" r="6" fill="#9D8FFF"/><text x="98.4" y="4.5" class="ns">auth</text><circle cx="160.8" cy="0" r="6" fill="#FF6B6B"/><text x="174.8" y="4.5" class="ns">messaging</text><circle cx="270.20000000000005" cy="0" r="6" fill="#2EC5FF"/><text x="284.20000000000005" y="4.5" class="ns">web and API</text><circle cx="392.80000000000007" cy="0" r="6" fill="#FFB547"/><text x="406.80000000000007" y="4.5" class="ns">backend</text><circle cx="489.00000000000006" cy="0" r="6" fill="#7C7FA8"/><text x="503.00000000000006" y="4.5" class="ns">operations</text><path d="M597.0 0 h30" stroke="#A9ABD0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="637.0" y="4.5" class="ns">passed in by deploy.sh</text></g>
