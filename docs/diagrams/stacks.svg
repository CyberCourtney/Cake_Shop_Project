<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" role="img" aria-labelledby="t d">
  <title id="t">CloudFormation stacks</title>
  <desc id="d">A bootstrap stack holds the artifacts bucket. An optional edge stack in us-east-1 holds the certificate. The root stack in eu-west-2 creates seven nested stacks: data, auth, messaging, api-gateway, frontend, backend and monitoring.</desc>
