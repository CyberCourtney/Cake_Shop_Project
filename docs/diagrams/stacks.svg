  <text x="56" y="80" class="h1">Every resource, in plain CloudFormation</text>
  <text x="56" y="108" class="h2">One root stack per environment with seven nested stacks. Arrows show which outputs feed which stack.</text>
    <rect x="56" y="150" width="360" height="250" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#7C7FA8" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="2 0"/><text x="76" y="176" class="zone">EU-WEST-2 · ONCE PER ACCOUNT</text>
  <rect x="96" y="200" width="280" height="84" rx="16" class="node" stroke="#7C7FA8"/>
  <rect x="110" y="220.0" width="44" height="44" rx="12" fill="#7C7FA8"/><use href="#i-bucket" x="120" y="230.0" width="24" height="24"/>
  <text x="166" y="228.0" class="nt">kvc-bootstrap</text>
  <text x="166" y="247.0" class="ns">artifacts bucket</text>
  <text x="166" y="263.0" class="ns">templates + zips</text>
  <rect x="56" y="440" width="360" height="250" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#2EC5FF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="2 0"/><text x="76" y="466" class="zone">US-EAST-1 · ONLY WITH A DOMAIN</text>
  <rect x="96" y="490" width="280" height="84" rx="16" class="node" stroke="#2EC5FF"/>
  <rect x="110" y="510.0" width="44" height="44" rx="12" fill="#2EC5FF"/><use href="#i-shield" x="120" y="520.0" width="24" height="24"/>
  <text x="166" y="518.0" class="nt">kvc-env-edge</text>
  <text x="166" y="537.0" class="ns">ACM certificate</text>
  <text x="166" y="553.0" class="ns">optional WAF</text>
  <rect x="470" y="150" width="1074" height="600" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#6C5CE7" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="2 0"/><text x="490" y="176" class="zone">EU-WEST-2 · KVC-ENV ROOT STACK</text>
  <rect x="510" y="210" width="270" height="84" rx="16" class="node" stroke="#B8F23A"/>
  <rect x="524" y="230.0" width="44" height="44" rx="12" fill="#B8F23A"/><use href="#i-db" x="534" y="240.0" width="24" height="24"/>
  <text x="580" y="246.0" class="nt">data</text>
  <text x="580" y="265.0" class="ns">DynamoDB table</text>
  <rect x="510" y="350" width="270" height="84" rx="16" class="node" stroke="#9D8FFF"/>
  <rect x="524" y="370.0" width="44" height="44" rx="12" fill="#9D8FFF"/><use href="#i-lock" x="534" y="380.0" width="24" height="24"/>
  <text x="580" y="378.0" class="nt">auth</text>
  <text x="580" y="397.0" class="ns">Cognito pool, domain,</text>
  <text x="580" y="413.0" class="ns">admins group</text>
  <rect x="510" y="490" width="270" height="84" rx="16" class="node" stroke="#FF6B6B"/>
  <rect x="524" y="510.0" width="44" height="44" rx="12" fill="#FF6B6B"/><use href="#i-mail" x="534" y="520.0" width="24" height="24"/>
  <text x="580" y="518.0" class="nt">messaging</text>
  <text x="580" y="537.0" class="ns">SNS, SES, DKIM records,</text>
  <text x="580" y="553.0" class="ns">dead-letter queue</text>
  <rect x="510" y="630" width="270" height="84" rx="16" class="node" stroke="#2EC5FF"/>
  <rect x="524" y="650.0" width="44" height="44" rx="12" fill="#2EC5FF"/><use href="#i-api" x="534" y="660.0" width="24" height="24"/>
  <text x="580" y="658.0" class="nt">api-gateway</text>
  <text x="580" y="677.0" class="ns">bare HTTP API</text>
  <text x="580" y="693.0" class="ns">breaks a cycle</text>
  <rect x="870" y="280" width="270" height="84" rx="16" class="node" stroke="#2EC5FF"/>
  <rect x="884" y="300.0" width="44" height="44" rx="12" fill="#2EC5FF"/><use href="#i-globe" x="894" y="310.0" width="24" height="24"/>
  <text x="940" y="308.0" class="nt">frontend</text>
  <text x="940" y="327.0" class="ns">bucket, CloudFront,</text>
  <text x="940" y="343.0" class="ns">Route 53 aliases</text>
  <rect x="870" y="520" width="270" height="84" rx="16" class="node" stroke="#FFB547"/>
  <rect x="884" y="540.0" width="44" height="44" rx="12" fill="#FFB547"/><use href="#i-lambda" x="894" y="550.0" width="24" height="24"/>
  <text x="940" y="548.0" class="nt">backend</text>
  <text x="940" y="567.0" class="ns">5 Lambdas, roles, routes,</text>
  <text x="940" y="583.0" class="ns">authorizer, stream</text>
  <rect x="1230" y="520" width="270" height="84" rx="16" class="node" stroke="#7C7FA8"/>
  <rect x="1244" y="540.0" width="44" height="44" rx="12" fill="#7C7FA8"/><use href="#i-chart" x="1254" y="550.0" width="24" height="24"/>
  <text x="1300" y="548.0" class="nt">monitoring</text>
  <text x="1300" y="567.0" class="ns">CloudWatch alarms,</text>
  <text x="1300" y="583.0" class="ns">AWS Budget</text>
