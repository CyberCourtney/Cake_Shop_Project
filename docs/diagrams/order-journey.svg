<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1216" width="1600" height="1216" role="img" aria-labelledby="t d">
  <title id="t">Customer order journey</title>
  <desc id="d">Sequence: the customer loads the catalogue, then places an order which is validated, re-priced on the server and written in one DynamoDB transaction.</desc>
